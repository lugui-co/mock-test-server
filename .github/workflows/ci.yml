name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem (sem push)
        run: docker build -t mock-serasa-server:ci .

      - name: Smoke test do container
        run: |
          docker run -d --name mock -p 3006:3006 \
            -e MIN_DELAY=0 -e MAX_DELAY=0 -e ERROR_CHANCE_PERCENT=0 \
            mock-serasa-server:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3006/health; then exit 0; fi
            sleep 1
          done
          docker logs mock
          exit 1
